<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Echte Worte. Echte Songs.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #f4eee6;
  --bg-soft: #fbf7f1;
  --card: rgba(255,255,255,0.78);
  --text: #1f1d1a;
  --muted: #6f675f;
  --accent: #6f3fd6;
  --accent-soft: #eee6ff;
  --line: rgba(90,72,54,0.14);
  --shadow-soft: 0 12px 28px rgba(66, 48, 31, 0.07);
  --radius: 24px;
  --max: 1120px;
}

body {
  margin: 0;
  font-family: "Inter", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
}

main {
  max-width: var(--max);
  margin: auto;
  padding: 24px;
}

.section-title {
  font-size: 34px;
  font-weight: 800;
}

.songs-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 24px;
}

.song-card {
  background: rgba(255,255,255,0.85);
  border-radius: 20px;
  padding: 14px;
  border: 1px solid var(--line);
}

.cover img {
  width: 100%;
  border-radius: 14px;
}

.song-card h3 {
  margin: 12px 0 4px;
}

.song-card p {
  margin: 0 0 10px;
  color: var(--muted);
}

.song-info-toggle {
  margin-top: 10px;
  padding: 8px 12px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: white;
  cursor: pointer;
  font-size: 14px;
}

.song-info {
  display: none;
  margin-top: 12px;
  font-size: 14px;
  color: #444;
}

.song-info.open {
  display: block;
}
</style>
</head>

<body>
<main>

<h2 class="section-title">Meine Songs</h2>

<div class="songs-grid">

  <div class="song-card">
    <div class="cover">
      <img src="luegen-klauen.jpg">
    </div>
    <h3>Lügen, Klauen und Zerstören</h3>
    <p>Mai 2026</p>
    <audio controls><source src="luegen-klauen.mp3"></audio>

    <button class="song-info-toggle" onclick="toggleSongInfo(this)">Zur Entstehung</button>
    <div class="song-info">
      <p>Dieser Song entstand aus einer intensiven Auseinandersetzung mit gesellschaftlichen Entwicklungen...</p>
    </div>
  </div>

  <div class="song-card">
    <div class="cover">
      <img src="denn-du-bleibst.jpeg">
    </div>
    <h3>Denn du bleibst</h3>
    <p>April 2025</p>
    <audio controls><source src="denn-du-bleibst.mp3"></audio>

    <button class="song-info-toggle" onclick="toggleSongInfo(this)">Zur Entstehung</button>
    <div class="song-info">
      <p>Ein persönlicher Song über das Bleibende im Leben...</p>
    </div>
  </div>

</div>

</main>

<script>
function toggleSongInfo(button) {
  const info = button.nextElementSibling;
  info.classList.toggle("open");
  button.textContent = info.classList.contains("open")
    ? "Schließen"
    : "Zur Entstehung";
}
</script>

</body>
</html>
